[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-temporal-entropy"
version = "1.0.0"
description = "Compute Sleep Temporal Entropy from sleep-stage episodes in NSRR XML annotations."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Jiong Chen"}
]
keywords = ["sleep", "entropy", "hypnogram", "sleep fragmentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sleep-temporal-entropy = "sleep_temporal_entropy.cli:main"

[project.urls]
Homepage = "https://github.com/JonChen916/SleepTemporalEntropy"
Repository = "https://github.com/JonChen916/SleepTemporalEntropy"
Issues = "https://github.com/JonChen916/SleepTemporalEntropy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
